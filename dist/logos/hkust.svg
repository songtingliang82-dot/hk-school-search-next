  </defs>
  <!-- Shield -->
  <path d="M60 10 L110 35 L110 85 Q110 115 60 135 Q10 115 10 85 L10 35 Z" fill="url(#hkust-shield)" stroke="#e74c3c" stroke-width="2.5"/>
