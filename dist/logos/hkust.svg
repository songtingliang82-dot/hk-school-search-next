  <circle cx="60" cy="54" r="3" fill="#e74c3c"/>
  <!-- Sun rays -->
  <line x1="60" y1="32" x2="60" y2="38" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="70" x2="60" y2="76" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="54" x2="44" y2="54" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
  <line x1="76" y1="54" x2="82" y2="54" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
  <line x1="44.5" y1="38.5" x2="48.5" y2="42.5" stroke="#e74c3c" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="71.5" y1="65.5" x2="75.5" y2="69.5" stroke="#e74c3c" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="75.5" y1="38.5" x2="71.5" y2="42.5" stroke="#e74c3c" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48.5" y1="65.5" x2="44.5" y2="69.5" stroke="#e74c3c" stroke-width="1.5" stroke-linecap="round"/>
