<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" fill="none">
  <defs>
    <linearGradient id="chc-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a5276"/>
      <stop offset="100%" stop-color="#0c2340"/>
    </linearGradient>
    <linearGradient id="chc-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#85c1e9"/>
      <stop offset="100%" stop-color="#3498db"/>
    </linearGradient>
    <linearGradient id="chc-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0c040"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
  </defs>
  <!-- Shield -->
  <path d="M60 10 L110 35 L110 85 Q110 115 60 135 Q10 115 10 85 L10 35 Z" fill="url(#chc-shield)" stroke="#85c1e9" stroke-width="2.5"/>
  <path d="M60 18 L103 39 L103 83 Q103 109 60 127 Q17 109 17 83 L17 39 Z" fill="none" stroke="rgba(133,193,233,0.25)" stroke-width="1.5"/>
  <!-- Chinese character inspired design / pillar symbol -->
  <rect x="48" y="38" width="4" height="30" rx="1" fill="#85c1e9" opacity="0.8"/>
  <rect x="68" y="38" width="4" height="30" rx="1" fill="#85c1e9" opacity="0.8"/>
  <rect x="46" y="52" width="28" height="3" rx="1.5" fill="#85c1e9" opacity="0.6"/>
  <rect x="46" y="60" width="28" height="3" rx="1.5" fill="#85c1e9" opacity="0.6"/>
  <!-- Gate top -->
  <path d="M44 38 L50 34 L70 34 L76 38" stroke="url(#chc-gold)" stroke-width="1.8" fill="none"/>
  <!-- Star -->
  <polygon points="60,42 61.5,45 64.5,45 62,47 63,50 60,48 57,50 58,47 55.5,45 58.5,45" fill="#f0c040" opacity="0.7"/>
  <!-- Water waves (珠海 = Pearl River / sea) -->
  <path d="M42 70 Q46 67 50 70 Q54 73 58 70 Q62 67 66 70 Q70 73 74 70 Q78 67 82 70" stroke="#85c1e9" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- Text -->
  <text x="60" y="99" text-anchor="middle" fill="#85c1e9" font-family="Georgia,serif" font-size="9" font-weight="700" letter-spacing="1">CHC</text>
  <rect x="38" y="106" width="44" height="5" rx="2.5" fill="#0c2340" stroke="#85c1e9" stroke-width="0.8"/>
  <text x="60" y="110.5" text-anchor="middle" fill="#85c1e9" font-family="sans-serif" font-size="3.8" font-weight="600" letter-spacing="0.5">EST. 1947</text>
</svg>