<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" fill="none">
  <defs>
    <linearGradient id="cityu-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b1a1a"/>
      <stop offset="100%" stop-color="#5c1010"/>
    </linearGradient>
    <linearGradient id="cityu-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="cityu-ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#922b21"/>
      <stop offset="100%" stop-color="#b03a2e"/>
    </linearGradient>
  </defs>
  <!-- Shield -->
  <path d="M60 10 L110 35 L110 85 Q110 115 60 135 Q10 115 10 85 L10 35 Z" fill="url(#cityu-shield)" stroke="#e74c3c" stroke-width="2.5"/>
  <path d="M60 18 L103 39 L103 83 Q103 109 60 127 Q17 109 17 83 L17 39 Z" fill="none" stroke="rgba(231,76,60,0.25)" stroke-width="1.5"/>
  <!-- Top band -->
  <rect x="28" y="32" width="64" height="14" rx="3" fill="url(#cityu-accent)" opacity="0.2"/>
  <!-- City skyline symbol -->
  <rect x="40" y="46" width="6" height="18" rx="1" fill="url(#cityu-accent)"/>
  <rect x="48" y="38" width="8" height="26" rx="1" fill="#e74c3c"/>
  <rect x="58" y="44" width="6" height="20" rx="1" fill="url(#cityu-accent)"/>
  <rect x="66" y="36" width="8" height="28" rx="1" fill="#e74c3c"/>
  <rect x="76" y="48" width="6" height="16" rx="1" fill="url(#cityu-accent)"/>
  <!-- Star -->
  <polygon points="60,52 62,58 68,58 63,62 65,68 60,64 55,68 57,62 52,58 58,58" fill="#fff" opacity="0.9"/>
  <!-- Decorative dots -->
  <circle cx="35" cy="82" r="2" fill="#e74c3c" opacity="0.5"/>
  <circle cx="85" cy="82" r="2" fill="#e74c3c" opacity="0.5"/>
  <!-- Text -->
  <text x="60" y="100" text-anchor="middle" fill="#e74c3c" font-family="Georgia,serif" font-size="10" font-weight="700" letter-spacing="0.5">CityU</text>
  <rect x="38" y="106" width="44" height="5" rx="2.5" fill="url(#cityu-ribbon)"/>
  <text x="60" y="110.5" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="3.8" font-weight="600" letter-spacing="0.5">EST. 1984</text>
</svg>